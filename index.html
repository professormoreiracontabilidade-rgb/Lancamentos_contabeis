iv class="tag">QUESTÃO '+(st.idx+1)+' DE 50</div><h2>Este lançamento está correto?</h2><p>'+esc(q.s)+'</p><div class="entry"><b>D</b> — '+esc(q.d)+'<br><b>C</b> — '+esc(q.c)+'</div><div class="choices"><button id="yes" '+(a!==null?'disabled':'')+'>✓ Certo</button><button id="no" '+(a!==null?'disabled':'')+'>✕ Errado</button></div><button id="confirm" class="primary" style="margin-top:14px" disabled>Confirmar resposta</button><div id="feedback" aria-live="polite"></div></section>';['yes','no'].forEach((id,i)=>document.getElementById(id).onclick=()=>{chosen=i===0;document.getElementById('yes').classList.toggle('selected',chosen);document.getElementById('no').classList.toggle('selected',!chosen);document.getElementById('confirm').disabled=false});document.getElementById('confirm').onclick=()=>{if(chosen===null)return;st.answers[st.idx]=chosen;save();sound(chosen===q.a);render()};if(a!==null){const ok=a===q.a;document.getElementById(a?'yes':'no').classList.add(ok?'good':'bad');document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b><span class="lamp"></span>'+(ok?'Você acertou!':'Você errou.')+'</b><p><b>Gabarito: '+(q.a?'Certo':'Errado')+'.</b></p><p>'+esc(q.e)+'</p><p><b>Lançamento correto:</b><br>D — '+esc(q.cd)+'<br>C — '+esc(q.cc)+'</p></div>'}document.getElementById('prev').disabled=st.idx===0;document.getElementById('next').disabled=a===null;document.getElementById('next').textContent=st.idx===49?'Resultado →':'Avançar →'}function result(){let n=st.answers.filter(x=>x!==null).length,score=st.answers.reduce((s,a,i)=>s+(a!==null&&a===Q[i].a?1:0),0);app.innerHTML='<section class="card"><div class="tag">RESULTADO FINAL</div><h1>'+esc(st.name)+'</h1><h2>'+score+' acertos em 50 questões</h2><p>Aproveitamento: <b>'+Math.round(score/50*100)+'%</b><br>Erros: '+(n-score)+'<br>Não respondidas: '+(50-n)+'</p><button class="primary" id="review">Revisar respostas</button><button class="primary" id="send" style="margin-top:12px;background:#
